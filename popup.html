<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Snippet Expander</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <h1><img src="icons/icon32.png" alt="" /> Snippet Expander</h1>
    <a href="https://docs.google.com/spreadsheets/d/1H2rBzMQzZk74Bk2Z_Mo8lXAdYea7Mi7WfzVruBahd_I/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="btn-secondary">✏️ Modifier les données</a>
    <button id="refresh-btn">🔄 Actualiser les données</button>
    <p class="hint" id="refresh-status"></p>
    <div class="toggle-row">
      <label for="aviso-icon-enabled">Intégration Aviso</label>
      <input type="checkbox" id="aviso-icon-enabled" />
    </div>

    <section class="import">
      <h2>📥 Données de dossier</h2>
      <p class="hint" id="import-count"></p>
      <textarea id="import-text" rows="4" placeholder="Collez ici le texte des articles (GN 12 — …)"></textarea>
      <div class="import-actions">
        <button id="import-btn">Importer le texte collé</button>
        <label class="file-btn" for="import-file">📄 Ou choisir un fichier .txt</label>
        <input type="file" id="import-file" accept=".txt,text/plain" hidden />
      </div>
      <p class="hint" id="import-status"></p>
    </section>

    <a href="#" id="open-options" class="link-btn">⚙️ Paramètres</a>
  </div>
  <script src="imported-data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
