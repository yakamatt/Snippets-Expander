<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Snippet Expander</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <h1><img src="icons/icon32.png" alt="" /> Snippet Expander</h1>
    <button id="open-clausier">📒 Modifier le Clausier Personnel</button>
    <a href="#" id="open-sheet-link" target="_blank" rel="noopener noreferrer" class="btn-secondary">📄 Consulter le Clausier Commun</a>

    <section class="import">
      <h2>📥 DatAviso AI</h2>
      <p class="hint" id="import-count"></p>
      <div class="import-actions">
        <label class="file-btn" for="import-file">📄 Importer un fichier .txt</label>
        <input type="file" id="import-file" accept=".txt,text/plain" hidden />
        <button id="import-clear" class="danger-btn">🗑️ Effacer les données DatAviso AI</button>
      </div>
      <p class="hint" id="import-status"></p>
    </section>

    <section class="feedback">
      <h2>💬 Une remarque, une idée, un bug ?</h2>
      <p class="hint">Dites-le-nous via le formulaire. Laissez vos coordonnées si vous souhaitez être recontacté.</p>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfoqLX5kXZhK2A4SbFiMto1reNpPCfbhWqesYWk2ubZmwHTVw/viewform?usp=publish-editor" target="_blank" rel="noopener noreferrer" class="btn-secondary">✉️ Donner mon avis</a>
    </section>

    <a href="#" id="open-options" class="link-btn">⚙️ Paramètres</a>
  </div>
  <script src="imported-data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
